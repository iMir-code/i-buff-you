<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    /* === VARIABILI TEMA === */
    :root[data-theme="dark"] {
      --bg: #0f0f0f;
      --surface: #1a1a1a;
      --border: #2a2a2a;
      --text: #e8e8e8;
      --text-muted: #666;
      --accent: #c8a96e;
      --matched: #4a7c59;
      --waiting: #444;
      --danger: #8b3a3a;
      --success: #4a7c59;
      --btn-bg: #2a2a2a;
      --btn-text: #e8e8e8;
    }
    :root[data-theme="light"] {
      --bg: #f5f5f5;
      --surface: #ffffff;
      --border: #ddd;
      --text: #111;
      --text-muted: #999;
      --accent: #8b6914;
      --matched: #2d6b3c;
      --waiting: #bbb;
      --danger: #c0392b;
      --success: #2d6b3c;
      --btn-bg: #e8e8e8;
      --btn-text: #111;
    }

    /* === RESET & BASE === */
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 16px;
      min-height: 100vh;
      max-width: 480px;
      margin: 0 auto;
    }

    /* === VIEW MANAGEMENT === */
    .view { display: none; flex-direction: column; min-height: 100vh; }
    .view.active { display: flex; }

    /* === LOGIN VIEW === */
    #view-login {
      justify-content: center;
      align-items: center;
      padding: 2rem;
      gap: 1.5rem;
    }
    #view-login h1 { font-size: 2rem; letter-spacing: 0.1em; color: var(--accent); }
    #view-login p.subtitle { color: var(--text-muted); font-size: 0.9rem; }

    /* === MAIN VIEW === */
    #view-main { padding-bottom: 1rem; }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1rem;
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      background: var(--bg);
      z-index: 10;
    }
    .header h1 { font-size: 1.1rem; color: var(--accent); }
    .header-user { font-size: 0.9rem; color: var(--text-muted); }

    /* === TAB SELECTOR === */
    .tabs {
      display: flex;
      border-bottom: 1px solid var(--border);
      background: var(--bg);
      position: sticky;
      top: 57px;
      z-index: 9;
    }
    .tab-btn {
      flex: 1;
      padding: 0.75rem;
      border: none;
      background: none;
      color: var(--text-muted);
      font-size: 0.85rem;
      font-weight: 500;
      cursor: pointer;
      border-bottom: 2px solid transparent;
      letter-spacing: 0.05em;
    }
    .tab-btn.active {
      color: var(--accent);
      border-bottom-color: var(--accent);
    }

    /* === SLOT CARDS === */
    .slots-container { padding: 0.75rem; display: flex; flex-direction: column; gap: 0.75rem; }
    .slot-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
    }
    .slot-header {
      padding: 0.6rem 0.75rem;
      font-size: 0.8rem;
      color: var(--text-muted);
      border-bottom: 1px solid var(--border);
      font-weight: 600;
      letter-spacing: 0.05em;
    }
    .slot-header.current { color: var(--accent); }
    .buff-section { padding: 0.6rem 0.75rem; }
    .buff-section + .buff-section { border-top: 1px solid var(--border); }
    .buff-label {
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-bottom: 0.3rem;
      font-weight: 600;
    }
    .booking-row {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      font-size: 0.9rem;
      padding: 0.2rem 0;
    }
    .booking-name { flex: 1; }
    .booking-name.matched { color: var(--matched); font-weight: 500; }
    .booking-name.waiting { color: var(--waiting); }
    .match-arrow { color: var(--matched); font-size: 0.8rem; }
    .cancel-btn {
      background: none;
      border: none;
      color: var(--danger);
      cursor: pointer;
      font-size: 1rem;
      padding: 0 0.2rem;
      line-height: 1;
    }
    .slot-actions {
      padding: 0.5rem 0.75rem;
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem;
      border-top: 1px solid var(--border);
    }

    /* === SETTINGS VIEW === */
    #view-settings { padding: 1rem; gap: 1.5rem; }
    .settings-header {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      padding-bottom: 1rem;
      border-bottom: 1px solid var(--border);
    }
    .settings-section { display: flex; flex-direction: column; gap: 0.75rem; }
    .settings-section h3 { font-size: 0.75rem; color: var(--text-muted); letter-spacing: 0.1em; font-weight: 600; }
    .settings-row { display: flex; flex-direction: column; gap: 0.3rem; }
    .settings-label { font-size: 0.85rem; color: var(--text-muted); }
    .tz-preview { font-size: 0.8rem; color: var(--accent); margin-top: 0.2rem; }
    .admin-section { border-top: 1px solid var(--border); padding-top: 1rem; }
    .user-list-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.5rem 0;
      border-bottom: 1px solid var(--border);
      font-size: 0.9rem;
    }

    /* === COMPONENTI CONDIVISI === */
    input, select {
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 0.75rem;
      border-radius: 6px;
      font-size: 1rem;
    }
    input:focus, select:focus { outline: none; border-color: var(--accent); }
    .btn {
      background: var(--btn-bg);
      color: var(--btn-text);
      border: 1px solid var(--border);
      padding: 0.6rem 0.9rem;
      border-radius: 6px;
      font-size: 0.8rem;
      cursor: pointer;
      font-weight: 500;
      letter-spacing: 0.03em;
      white-space: nowrap;
    }
    .btn:active { opacity: 0.7; }
    .btn-primary { background: var(--accent); color: #fff; border-color: var(--accent); }
    .btn-full { width: 100%; padding: 0.9rem; font-size: 1rem; }
    .btn-danger { background: var(--danger); color: #fff; border-color: var(--danger); }
    .btn-icon { background: none; border: none; cursor: pointer; font-size: 1.3rem; padding: 0.25rem; color: var(--text); }
    .error-msg { color: var(--danger); font-size: 0.85rem; text-align: center; min-height: 1.2em; }
    .loading { color: var(--text-muted); text-align: center; padding: 2rem; font-size: 0.9rem; }
    .empty-msg { color: var(--text-muted); font-size: 0.85rem; font-style: italic; }

</head>

    // Restituisce la stringa tradotta nella lingua corrente
    function T(key) {
      const lang = STATE.profile?.language || 'en';
      return (TRANSLATIONS[lang] || TRANSLATIONS.en)[key] || key;
    }

    // === STATE ===
    const STATE = {

    // === VIEW MANAGEMENT ===
    function showView(viewId) {

    // === AUTH ===
    const AUTH = {
      async login(username, password) {
        const slug = username.trim().toLowerCase().replace(/\s+/g, '_');
        const email = `${slug}@ibuffyou.game`;
        const { data, error } = await db.auth.signInWithPassword({ email, password });
        if (error) throw new Error(error.message);
        return data.session;
      },

      async logout() {
        await db.auth.signOut();
        STATE.session = null;
        STATE.profile = null;
        STATE.bookings = [];
        if (STATE.realtimeChannel) {
          db.removeChannel(STATE.realtimeChannel);
          STATE.realtimeChannel = null;
        }
        showView('view-login');
      },

      async getSession() {
        const { data } = await db.auth.getSession();
        return data.session;
      },
    };

    // === TIME_UTILS ===
    const TIME = {
      // Restituisce la data in UTC-2 per offsetFromToday giorni in avanti
      _gameDateStr(offsetFromToday = 0) {
        const now = new Date();
        // Converti in UTC-2: sottrai 2 ore
        const utcMinus2 = new Date(now.getTime() - 2 * 60 * 60 * 1000);
        utcMinus2.setUTCDate(utcMinus2.getUTCDate() + offsetFromToday);
        return utcMinus2.toISOString().slice(0, 10);  // "YYYY-MM-DD"
      },

      // Ritorna i 3 giorni di gioco visibili
      getGameDays() {
        return [0, 1, 2].map(i => ({ date: this._gameDateStr(i), dayOffset: i }));
      },

      // Orario slot in ora locale dell'utente: "HH:MM – HH:MM"
      getSlotRange(gameDay, slotIndex, tzOffset) {
        // Slot start/end in UTC-2
        const startHourUTCminus2 = slotIndex * 4;
        const endHourUTCminus2 = startHourUTCminus2 + 4;
        // Converti in ora locale: UTC-2 → UTC → UTC+tzOffset
        const localOffset = tzOffset - (-2);  // differenza da UTC-2 a timezone utente
        const startLocal = (startHourUTCminus2 + localOffset + 48) % 24;
        const endLocal = (endHourUTCminus2 + localOffset + 48) % 24;
        const fmt = h => String(h).padStart(2, '0') + ':00';
        return `${fmt(startLocal)} – ${fmt(endLocal)}`;
      },

      // Calcola a che ora locale parte la giornata di gioco (slot 0 inizio)
      getDayStartLocal(tzOffset) {
        const localOffset = tzOffset - (-2);
        const startLocal = (0 + localOffset + 48) % 24;
        return String(startLocal).padStart(2, '0') + ':00';
      },

      // Lo slot è già passato?
      isSlotExpired(gameDay, slotIndex) {
        const now = new Date();
        const utcMinus2 = new Date(now.getTime() - 2 * 60 * 60 * 1000);
        const todayStr = utcMinus2.toISOString().slice(0, 10);
        if (gameDay < todayStr) return true;
        if (gameDay > todayStr) return false;
        // È oggi in UTC-2: confronta slot con ora corrente
        const currentHour = utcMinus2.getUTCHours();
        const slotEndHour = (slotIndex + 1) * 4;
        return currentHour >= slotEndHour;
      },

      // Indice dello slot corrente nella giornata di gioco (o -1 se non è oggi)
      getCurrentSlotIndex(gameDay) {
        const now = new Date();
        const utcMinus2 = new Date(now.getTime() - 2 * 60 * 60 * 1000);
        const todayStr = utcMinus2.toISOString().slice(0, 10);
        if (gameDay !== todayStr) return -1;
        return Math.floor(utcMinus2.getUTCHours() / 4);
      },
    };

    // === PROFILE ===
    const PROFILE = {
      async load(userId) {
        const { data, error } = await db

          .select('*')
          .eq('id', userId)
          .single();
        if (error) throw error;
        STATE.profile = data;
        this.applyTheme(data.theme);
        this.applyLanguage(data.language);
        return data;
      },

      async save({ display_name, timezone_offset, language, theme }) {
        const { error } = await db
          .from('profiles')
          .update({ display_name, timezone_offset, language, theme })
          .eq('id', STATE.session.user.id);
        if (error) throw error;
        STATE.profile = { ...STATE.profile, display_name, timezone_offset, language, theme };
        this.applyTheme(theme);
        this.applyLanguage(language);

      },

      applyLanguage(lang) {
        document.documentElement.lang = lang || 'en';
      },
    };

    // === BOOKINGS ===
    const BOOKINGS = {
      async fetchAll() {
        const gameDays = TIME.getGameDays().map(d => d.date);
        const { data, error } = await db
          .from('bookings')
          .select(`
            id, user_id, game_day, slot_index, role, buff_type, matched_with, created_at,
            profiles!bookings_user_id_fkey ( display_name )
          `)
          .in('game_day', gameDays)
          .order('created_at', { ascending: true });
        if (error) throw error;
        // Appiattisci display_name
        STATE.bookings = (data || []).map(b => ({
          ...b,
          display_name: b.profiles?.display_name || '?',
        }));
        return STATE.bookings;
      },

      async cleanup() {
        await db.rpc('cleanup_old_bookings', { p_user_id: STATE.session.user.id });
      },

      // Filtra i bookings per slot specifico
      forSlot(gameDay, slotIndex) {
        return STATE.bookings.filter(
          b => b.game_day === gameDay && b.slot_index === slotIndex
        );
      },

      // Booking dell'utente corrente per un dato slot+ruolo+tipo
      myBooking(gameDay, slotIndex, role, buffType) {
        return STATE.bookings.find(
          b => b.game_day === gameDay &&
               b.slot_index === slotIndex &&
               b.role === role &&
               b.buff_type === buffType &&
               b.user_id === STATE.session.user.id
        );
      },
    };

    // === MATCHING ===
    const MATCHING = {
      async book(gameDay, slotIndex, role, buffType) {
        // Inserisci il booking
        const { data: newBooking, error: insertError } = await db
          .from('bookings')
          .insert({
            user_id: STATE.session.user.id,
            game_day: gameDay,
            slot_index: slotIndex,
            role: role,
            buff_type: buffType,
          })
          .select()
          .single();
        if (insertError) throw insertError;

        // Chiama RPC per tentare il match
        await db.rpc('try_match_booking', { p_booking_id: newBooking.id });

        // Ricarica tutti i bookings
        await BOOKINGS.fetchAll();
      },

      async cancel(bookingId) {
        // Prima rimuovi il match del partner (se esiste)
        await db.rpc('unmatch_partner', { p_booking_id: bookingId });

        // Poi elimina il proprio booking
        const { error } = await db
          .from('bookings')
          .delete()
          .eq('id', bookingId);
        if (error) throw error;

        // Ricarica
        await BOOKINGS.fetchAll();
      },
    };

    // === RENDER ===
    const RENDER = {
      mainView() {
        const profile = STATE.profile;
        const tzOffset = profile?.timezone_offset ?? 0;
        const gameDays = TIME.getGameDays();
        const today = gameDays[STATE.activeDay];

        // Aggiorna header
        document.getElementById('header-username').textContent = profile?.display_name || '';

        // Aggiorna tab labels
        const dayKeys = ['today', 'tomorrow', 'after'];
        gameDays.forEach((_, i) => {
          const btn = document.getElementById(`tab-${i}`);
          if (btn) btn.textContent = T(dayKeys[i]);
        });

        // Rendering slot cards
        const container = document.getElementById('slots-container');
        let html = '';
        for (let slotIdx = 0; slotIdx < 6; slotIdx++) {
          if (TIME.isSlotExpired(today.date, slotIdx)) continue;
          const isCurrent = TIME.getCurrentSlotIndex(today.date) === slotIdx;
          const timeRange = TIME.getSlotRange(today.date, slotIdx, tzOffset);
          const slotBookings = BOOKINGS.forSlot(today.date, slotIdx);

          html += `<div class="slot-card">
            <div class="slot-header ${isCurrent ? 'current' : ''}">${timeRange}</div>
            ${this._buffSection(today.date, slotIdx, slotBookings, 'science')}
            ${this._buffSection(today.date, slotIdx, slotBookings, 'construction')}
          </div>`;
        }
        container.innerHTML = html || `<div class="empty-msg" style="padding:1rem">${T('loading')}</div>`;
      },

      _buffSection(gameDay, slotIdx, slotBookings, buffType) {
        const myId = STATE.session?.user?.id;
        const typeKey = buffType === 'science' ? 'science' : 'construction';
        const icon = buffType === 'science' ? '🔬' : '🏗';
        const donors = slotBookings.filter(b => b.buff_type === buffType && b.role === 'donor');
        const requesters = slotBookings.filter(b => b.buff_type === buffType && b.role === 'requester');

        const renderList = (list, role) => {
          if (list.length === 0) return '';
          return list.map(b => {
            const isMe = b.user_id === myId;
            const isMatched = !!b.matched_with;
            const partner = isMatched
              ? slotBookings.find(x => x.id === b.matched_with)
              : null;
            let nameHtml;
            if (isMatched && partner) {
              if (role === 'donor') {
                nameHtml = `<span class="booking-name matched">${b.display_name} <span class="match-arrow">↔</span> ${partner.display_name}</span>`;
                // Il bottone ✕ appare se l'utente corrente è il donatore O il richiedente della coppia
                const isMeInPair = b.user_id === myId || partner.user_id === myId;
                const myBookingId = b.user_id === myId ? b.id : partner.id;
                const cancelBtn = isMeInPair
                  ? `<button class="cancel-btn" data-booking-id="${myBookingId}" title="Cancel">✕</button>`
                  : '';
                return `<div class="booking-row">${nameHtml}${cancelBtn}</div>`;
              } else {
                return '';  // requester matchato: mostrato nella riga del donor
              }
            } else {
              nameHtml = `<span class="booking-name waiting">${b.display_name} (${T('waiting')})</span>`;
            }
            const cancelBtn = isMe
              ? `<button class="cancel-btn" data-booking-id="${b.id}" title="Cancel">✕</button>`
              : '';
            return `<div class="booking-row">${nameHtml}${cancelBtn}</div>`;
          }).join('');
        };

        const hasMyDonor = !!BOOKINGS.myBooking(gameDay, slotIdx, 'donor', buffType);
        const hasMyRequester = !!BOOKINGS.myBooking(gameDay, slotIdx, 'requester', buffType);
        const donateKey = buffType === 'science' ? 'donate_science' : 'donate_construction';
        const requestKey = buffType === 'science' ? 'request_science' : 'request_construction';

        const actions = [];
        if (!hasMyDonor) actions.push(`<button class="btn" data-action="book" data-role="donor" data-buff="${buffType}" data-day="${gameDay}" data-slot="${slotIdx}">${T(donateKey)}</button>`);
        if (!hasMyRequester) actions.push(`<button class="btn" data-action="book" data-role="requester" data-buff="${buffType}" data-day="${gameDay}" data-slot="${slotIdx}">${T(requestKey)}</button>`);

        return `<div class="buff-section">
          <div class="buff-label">${icon} ${T(typeKey)}</div>
          ${renderList(donors, 'donor')}
          ${renderList(requesters, 'requester')}
          ${actions.length ? `<div class="slot-actions">${actions.join('')}</div>` : ''}
        </div>`;
      },

      settingsView() {
        const p = STATE.profile;
        if (!p) return;
        document.getElementById('settings-nickname').value = p.display_name || '';
        document.getElementById('settings-language').value = p.language || 'en';
        document.getElementById('settings-theme').value = p.theme || 'dark';

        // Popola select timezone
        const tzSelect = document.getElementById('settings-timezone');
        if (tzSelect.options.length === 0) {
          for (let i = -12; i <= 14; i++) {
            const opt = document.createElement('option');
            opt.value = i;
            opt.textContent = `UTC${i >= 0 ? '+' : ''}${i}`;
            tzSelect.appendChild(opt);
          }
        }
        tzSelect.value = p.timezone_offset ?? 0;
        this._updateTzPreview(p.timezone_offset ?? 0);

        // Admin panel
        const adminSection = document.getElementById('admin-section');
        if (p.role === 'admin') {
          adminSection.style.display = 'block';
          if (typeof ADMIN !== 'undefined') ADMIN.renderUserList();
        } else {
          adminSection.style.display = 'none';
        }

        this.applyTranslations();
      },

      _updateTzPreview(offset) {
        const preview = document.getElementById('tz-preview');
        if (preview) {
          preview.textContent = `${T('day_starts')} ${TIME.getDayStartLocal(Number(offset))} (${T('your_time')})`;
        }
      },

      applyTranslations() {
        const map = {
          'login-subtitle': 'login_subtitle',
          'login-btn': 'enter',
          'settings-title': 'settings',
          'settings-section-profile': 'profile',
          'settings-section-display': 'display',
          'settings-section-admin': 'admin_panel',
          'label-nickname': 'nickname',
          'label-language': 'language',
          'label-theme': 'theme',
          'label-timezone': 'timezone',
          'settings-save': 'save',
          'logout-btn': 'logout',
          'slots-loading': 'loading',
          'admin-create-btn': 'create_user',
        };
        Object.entries(map).forEach(([id, key]) => {
          const el = document.getElementById(id);
          if (el) el.textContent = T(key);
        });
        const nn = document.getElementById('admin-new-nickname');
        if (nn) nn.placeholder = T('new_nickname');
        const pw = document.getElementById('admin-new-password');
        if (pw) pw.placeholder = T('temp_password');
      },
    };

    // === ADMIN ===
    const ADMIN = {
      async renderUserList() {
        const container = document.getElementById('admin-user-list');
        const { data, error } = await db
          .from('profiles')
          .select('id, display_name, active, role')
          .order('display_name');
        if (error) { container.innerHTML = `<div class="error-msg">${error.message}</div>`; return; }

        container.innerHTML = data.map(u => `
          <div class="user-list-item">
            <span>${u.display_name} ${u.role === 'admin' ? '★' : ''}</span>
            <span style="font-size:0.75rem;color:var(--text-muted)">${u.active ? T('active') : T('inactive')}</span>
            ${u.id !== STATE.session.user.id
              ? `<button class="btn ${u.active ? 'btn-danger' : ''}" data-action="toggle-active" data-user-id="${u.id}" data-current-active="${u.active}">
                  ${u.active ? T('deactivate') : T('activate')}
                 </button>`
              : ''}
          </div>
        `).join('');
      },

      async toggleActive(userId, currentActive) {
        await db.from('profiles')
          .update({ active: !currentActive })
          .eq('id', userId);
        this.renderUserList();
      },

      async createUser(nickname, password) {
        const slug = nickname.trim().toLowerCase().replace(/\s+/g, '_').replace(/[^a-z0-9_]/g, '');
        if (!slug || !password) throw new Error('invalid input');
        const email = `${slug}@ibuffyou.game`;

        // Client temporaneo isolato: signUp non sostituisce la sessione dell'admin
        const tmpClient = createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
          auth: { persistSession: false, storageKey: 'ibuffyou-tmp-signup' }
        });

        const { data, error } = await tmpClient.auth.signUp({ email, password });
        if (error) throw error;

        if (data?.user) {
          // Upsert come nuovo utente (RLS: può scrivere il proprio profilo)
          await tmpClient.from('profiles').upsert({
            id: data.user.id,
            display_name: nickname.trim(),
            active: true,
            role: 'user',
          }, { onConflict: 'id' });
          await tmpClient.auth.signOut();
        }

        await this.renderUserList();
      },
    };

    // === EVENTS ===
    function initEvents() {
      // LOGIN
      document.getElementById('login-btn').addEventListener('click', async () => {
        const username = document.getElementById('login-username').value.trim();
        const password = document.getElementById('login-password').value;
        const errEl = document.getElementById('login-error');
        errEl.textContent = '';
        if (!username || !password) return;
        try {
          STATE.session = await AUTH.login(username, password);
          await onLoggedIn();
        } catch (e) {
          errEl.textContent = T('error_login');
        }
      });

      // Invio con Enter nel form di login
      ['login-username', 'login-password'].forEach(id => {
        document.getElementById(id).addEventListener('keydown', e => {
          if (e.key === 'Enter') document.getElementById('login-btn').click();
        });
      });

      // LOGOUT
      document.getElementById('logout-btn').addEventListener('click', () => AUTH.logout());

      // NAVIGAZIONE SETTINGS
      document.getElementById('settings-btn').addEventListener('click', () => {
        RENDER.settingsView();
        showView('view-settings');
      });
      document.getElementById('settings-back').addEventListener('click', () => {
        showView('view-main');
        RENDER.mainView();
      });

      // TAB SELECTOR
      document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          STATE.activeDay = Number(btn.dataset.day);
          RENDER.mainView();
        });
      });

      // AZIONI DINAMICHE (booking + cancel + admin toggle)
      document.addEventListener('click', async (e) => {
        // Prenota slot
        if (e.target.dataset.action === 'book') {
          const { role, buff, day, slot } = e.target.dataset;
          e.target.disabled = true;
          try {
            await MATCHING.book(day, Number(slot), role, buff);
            RENDER.mainView();
          } finally {
            e.target.disabled = false;
          }
        }

        // Cancella prenotazione
        if (e.target.dataset.action === undefined && e.target.classList.contains('cancel-btn')) {
          const id = e.target.dataset.bookingId;
          if (!id) return;
          e.target.disabled = true;
          try {
            await MATCHING.cancel(id);
            RENDER.mainView();
          } finally {
            e.target.disabled = false;
          }
        }

        // Admin: attiva/disattiva utente
        if (e.target.dataset.action === 'toggle-active') {
          const { userId, currentActive } = e.target.dataset;
          await ADMIN.toggleActive(userId, currentActive === 'true');
        }
      });

      // ADMIN: CREA UTENTE
      document.getElementById('admin-create-btn').addEventListener('click', async () => {
        const errEl = document.getElementById('admin-create-error');
        const btn = document.getElementById('admin-create-btn');
        const nickname = document.getElementById('admin-new-nickname').value.trim();
        const password = document.getElementById('admin-new-password').value;
        errEl.textContent = '';
        btn.disabled = true;
        try {
          await ADMIN.createUser(nickname, password);
          document.getElementById('admin-new-nickname').value = '';
          document.getElementById('admin-new-password').value = '';
          errEl.style.color = 'var(--success)';
          errEl.textContent = T('user_created');
          setTimeout(() => { errEl.textContent = ''; errEl.style.color = ''; }, 3000);
        } catch (e) {
          errEl.style.color = '';
          errEl.textContent = T('error_create') + ': ' + (e.message || '');
        } finally {
          btn.disabled = false;
        }
      });

      // SAVE SETTINGS
      document.getElementById('settings-save').addEventListener('click', async () => {
        const errEl = document.getElementById('settings-error');
        errEl.textContent = '';
        try {
          const nickname = document.getElementById('settings-nickname').value.trim();
          const timezone_offset = Number(document.getElementById('settings-timezone').value);
          const language = document.getElementById('settings-language').value;
          const theme = document.getElementById('settings-theme').value;
          if (!nickname) { errEl.textContent = T('error_save'); return; }
          await PROFILE.save({ display_name: nickname, timezone_offset, language, theme });
          RENDER.applyTranslations();
          RENDER.settingsView();
        } catch (e) {
          errEl.textContent = T('error_save');
        }
      });

      // PREVIEW TIMEZONE in tempo reale
      document.getElementById('settings-timezone').addEventListener('change', (e) => {
        RENDER._updateTzPreview(Number(e.target.value));
      });
    }

    // === REALTIME ===
    function initRealtime() {
      if (STATE.realtimeChannel) db.removeChannel(STATE.realtimeChannel);
      STATE.realtimeChannel = db
        .channel('bookings-changes')
        .on('postgres_changes', { event: '*', schema: 'public', table: 'bookings' }, async () => {
          await BOOKINGS.fetchAll();
          if (document.getElementById('view-main').classList.contains('active')) {
            RENDER.mainView();
          }
        })
        .subscribe();
    }

    // === INIT ===
    async function onLoggedIn() {
      await PROFILE.load(STATE.session.user.id);

      // Verifica account attivo
      if (!STATE.profile.active) {
        await AUTH.logout();
        document.getElementById('login-error').textContent = T('error_login');
        return;
      }

      await BOOKINGS.cleanup();
      await BOOKINGS.fetchAll();
      initRealtime();
      RENDER.applyTranslations();
      document.getElementById('header-username').textContent = STATE.profile.display_name;
      showView('view-main');
      RENDER.mainView();
    }

    async function init() {
      initEvents();
      const session = await AUTH.getSession();
      if (session) {
        STATE.session = session;
        try {
          await onLoggedIn();
        } catch (e) {
          showView('view-login');
        }
      } else {
        showView('view-login');
      }
    }

    init();
  </script>
</body>
</html>
